name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd backend
          pytest -q

  frontend:
    name: Frontend — Next.js build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-tests:
    name: Frontend — tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run tests
        working-directory: frontend
        run: npm run test

  e2e-smoke:
    name: E2E — smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install playwright

      - name: Install Playwright Chromium (with system deps)
        run: python -m playwright install --with-deps chromium

      - name: Bootstrap database (create tables + seed demo data)
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/backend/e2e_ci.db
          JWT_SECRET: ci-not-secret-aaaaaaaaaaaaaaaaaaaaaaaa
          VAULT_KEY: ZEVBWUFaX0RFVl9WQVVMVF9LRVlfMzJCWVRFU18h
          DEBUG: "true"
          RATE_LIMIT_ENABLED: "false"
        run: |
          cd backend
          python -m scripts.create_all_sqlite
          python -m scripts.seed_demo

      - name: Start backend (uvicorn)
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/backend/e2e_ci.db
          JWT_SECRET: ci-not-secret-aaaaaaaaaaaaaaaaaaaaaaaa
          VAULT_KEY: ZEVBWUFaX0RFVl9WQVVMVF9LRVlfMzJCWVRFU18h
          DEBUG: "true"
          RATE_LIMIT_ENABLED: "false"
        run: |
          cd backend
          uvicorn ayaz.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting for backend to become healthy (up to 60s)..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: backend did not become healthy within 60 seconds"
          echo "--- last uvicorn output (if any) ---"
          exit 1

      - name: Build and start frontend (Next.js)
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          cd frontend
          npm ci
          npm run build
          npx next start -p 3000 &
          echo "Waiting for frontend to become available (up to 120s)..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Frontend available after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: frontend did not become available within 120 seconds"
          exit 1

      - name: Run E2E smoke suite
        env:
          AYAZ_API: http://127.0.0.1:8000
          AYAZ_WEB: http://localhost:3000
        run: |
          cd ${{ github.workspace }}
          python e2e/smoke.py

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore
